rySelector('#figure'),{scene,theme,onReadout:t=>document.querySelector('#readout').textContent=t});document.body.classList.toggle('light',theme==='light');document.querySelector('#fig').textContent=`FIG ${String(scene).padStart(2,'0')}`;document.querySelector('#name').textContent=model;document.querySelector('#slider').oninput=e=>m.setProgress(+e.target.value/100);m.setProgress(+(q.get('p')||.5));window.figure=m;</script></body></html>
